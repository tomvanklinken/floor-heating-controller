# Aanvoer- en retourtemperatuur (DS18B20 op de 1-wire bus van het shield)
one_wire:
  - platform: gpio
    setup_priority: 1000 # https://github.com/esphome/issues/issues/5983
    pin: ${onewire_pin}
    id: dallas_bus

button: # klik om 1-wire adressen te vinden (in de logs)
  - platform: template
    name: "Zoek 1-wire adressen"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(dallas_bus).search();
          id(dallas_bus).dump_config();

sensor:
  - platform: dallas_temp
    setup_priority: -100
    address: ${dallas_aanvoer}
    name: "Aanvoer temperatuur"
    id: aanvoer_temperatuur
    icon: "mdi:thermometer-chevron-up"
    accuracy_decimals: 2
    update_interval: ${dallas_update_interval}

  - platform: dallas_temp
    setup_priority: -100
    address: ${dallas_retour}
    name: "Retour temperatuur"
    id: retour_temperatuur
    icon: "mdi:thermometer-chevron-down"
    accuracy_decimals: 2
    update_interval: ${dallas_update_interval}
