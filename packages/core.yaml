# Board, API, OTA en logging voor de Nologo ESP32-C3 SuperMini
esphome:
  name: dbh-${kamer}
  friendly_name: "DBH ${kamer}"
  on_boot:
    priority: -200
    then:
      # Koel-PID altijd uit opstarten; de thermostaat zet hem weer aan
      # zodra er koelvraag is (RESTORE_DEFAULT_OFF gedrag)
      - climate.control:
          id: cooling_pid
          mode: "OFF"
  project:
    name: "tomvanklinken.jaga-dbh-controller"
    version: "1.0.0"
  # ESP32-C3 boot loop fix
  platformio_options:
    board_build.f_flash: 40000000L
    board_build.flash_mode: dio
    board_build.flash_size: 4MB

esp32:
  board: ${board}
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y

preferences:
  flash_write_interval: 60min

api:
  encryption:
    key: ${api_key}
  reboot_timeout: 30min

ota:
  - platform: esphome

safe_mode:

logger:
  level: ${log_level}
  logs:
    adc: NONE
    sensor: ERROR
    binary_sensor: INFO
    cover: INFO
    switch: INFO
    climate: INFO
    endstop: INFO
    text_sensor: ERROR
    dallas.temp.sensor: ERROR
    gpio.one_wire: INFO
    esp32.preferences: NONE
    safe_mode: NONE
    esp32_ble_tracker: INFO
    ### custom tags
    jaga_valve: DEBUG
    jaga_climate: DEBUG

# Geen status-LED: GPIO8 (onboard LED) wordt gebruikt voor de I2C-bus
